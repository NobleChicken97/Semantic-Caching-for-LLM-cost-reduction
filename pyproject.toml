# Tooling config only — dependency installation is via requirements.txt /
# requirements-dev.txt (Dockerfile and CI install from those). The [project]
# metadata table was removed 2026-09-03: it had drifted from requirements.txt
# and nothing ever pip-installs this package.
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
