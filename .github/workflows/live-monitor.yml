# Live-service monitor — project-specific post-deploy checks against the
# PRODUCTION Lightsail deployment (https://semcache.noblechicken.me).
# (Retired 2026-09-04 from the Render free URL: it now answers 503 and the
# production traffic moved to Lightsail with persistent storage.)
#
# Why this exists: ci.yml + docker-smoke prove the code is correct BEFORE it
# ships; this workflow proves the DEPLOYED service is actually healthy after
# ECR auto-deploy (or when it silently breaks). It asserts this app's own
# contracts — never generic pings:
#   /health          -> {"status":"ok","phase":7}
#   /                -> service card naming "Semantic Cache Proxy"
#   /metrics         -> hit_rate/total_requests/total_tokens_saved present
# No provider calls are made (zero quota spend); the cache itself is untouched.
#
# Deliberately NO write-path probe here: prod runs MOCK_LLM=true, so a keyless
# POST returns 200 (not the 401 BYOK contract — that shape is proven by the
# white-box suite instead), and any MISS would write rows into the production
# metrics the interview demo reads. Read-only checks only.
#
# Schedule: hourly. Manual runs via workflow_dispatch.

name: Live monitor

on:
  schedule:
    - cron: "0 * * * *"  # hourly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe deployed service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assert deployed contracts
        run: |
          set -euo pipefail
          BASE="https://semcache.noblechicken.me"

          echo "== /health =="
          HEALTH=$(curl -sS --max-time 90 --retry 2 "$BASE/health")
          echo "$HEALTH"
          echo "$HEALTH" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d['status'] == 'ok', d
          assert d['phase'] == 7, d
          "

          echo "== / (service card) =="
          ROOT=$(curl -sS --max-time 90 "$BASE/")
          echo "$ROOT"
          echo "$ROOT" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d['service'] == 'Semantic Cache Proxy', d
          assert 'chat_completions' in d['endpoints'], d
          "

          echo "== /metrics =="
          METRICS=$(curl -sS --max-time 90 "$BASE/metrics")
          echo "$METRICS"
          echo "$METRICS" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for k in ('hit_rate', 'total_requests', 'total_tokens_saved', 'per_user'):
              assert k in d, (k, d)
          "

          echo "== write-path probe: intentionally skipped (see header) =="

          echo "ALL LIVE CONTRACT CHECKS PASSED"
